name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend and Worker
        run: npm run build

      - name: Verify build outputs
        run: |
          test -s dist/client/index.html
          test -s dist/server/index.js
          test -s dist/server/wrangler.json
          test -s dist/.openai/hosting.json
          test -s dist/.openai/drizzle/0000_newsroom.sql
          test -s dist/.openai/drizzle/0001_overlay2.sql
          test -s dist/.openai/drizzle/0002_social_sources.sql
